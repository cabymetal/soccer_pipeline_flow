[project]
name = "api-consumer"
version = "1.0.0"
description = "data pipeline that moves data from source until vis"
authors = [
    {name = "Carlos Murillo",email = "cabymetal@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas (>=2.2.2,<2.3.0)",
    "pytest (>=8.3.5,<8.4.0)",
    "requests (>=2.31.0,<3.0.0)",
    "pyarrow (>=23.0.0,<24.0.0)",
    "boto3 (>=1.28.45,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
