# A sample job for soccer_api_consumer.

resources:
  jobs:
    sample_job:
      name: soccer_api_consumer_job

      trigger:
        # Run this job every day, exactly one day from the last run; see https://docs.databricks.com/api/workspace/jobs/create#trigger
        periodic:
          interval: 1
          unit: DAYS

      #email_notifications:
      #  on_failure:
      #    - your_email@example.com

      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        - name: source_path
          default: ${var.source_path}

      tasks:
        - task_key: team_ingestion
          notebook_task:
            notebook_path: ../src/team_ingestion.ipynb
        - task_key: playerwhl_task
          depends_on:
            - task_key: team_ingestion
          python_wheel_task:
            package_name: soccer_api_consumer
            entry_point: main
            parameters:
              - "--catalog"
              - "${var.catalog}"
              - "--schema"
              - "${var.schema}"
              - "--source_path"
              - "${var.source_path}"
          environment_key: default
        - task_key: silver_layer_task
          notebook_task:
            notebook_path: ../src/silver_layer_transformations.ipynb
          depends_on:
            - task_key: playerwhl_task

      environments:
        - environment_key: default
          spec:
            environment_version: "4"
            dependencies:
              # By default we just include the .whl file generated for the soccer_api_consumer package.
              # See https://docs.databricks.com/dev-tools/bundles/library-dependencies.html
              # for more information on how to add other libraries.
              - ../dist/*.whl
