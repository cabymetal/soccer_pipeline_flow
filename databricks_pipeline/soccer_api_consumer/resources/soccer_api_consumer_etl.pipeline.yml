# The main pipeline for soccer_api_consumer

resources:
  pipelines:
    soccer_api_consumer_etl:
      name: soccer_api_consumer_etl
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      root_path: "../src/soccer_api_consumer_etl"

      libraries:
        - glob:
            include: ../src/soccer_api_consumer_etl/transformations/**

      environment:
        dependencies:
          # We include every dependency defined by pyproject.toml by defining an editable environment
          # that points to the folder where pyproject.toml is deployed.
          - --editable ${workspace.file_path}
