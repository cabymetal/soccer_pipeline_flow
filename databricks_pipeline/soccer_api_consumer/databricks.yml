# This is a Databricks asset bundle definition for soccer_api_consumer.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: soccer_api_consumer
  uuid: 11855b37-874d-4842-9b41-d8a7678a33ae

include:
  - resources/*.yml
  - resources/*/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. Environment-specific identifiers have no value in this file:
# set them as environment variables (e.g. in the gitignored repo-root .env) before running the CLI:
#   DATABRICKS_HOST                    workspace URL (bundles can't interpolate variables in workspace.host)
#   BUNDLE_VAR_source_path             s3://<bucket>
#   BUNDLE_VAR_cluster_id              dev cluster
#   BUNDLE_VAR_instance_profile_arn    arn:aws:iam::<account-id>:instance-profile/databricks-s3-instance-profile
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use
  source_path:
    # no default on purpose: set the BUNDLE_VAR_source_path environment variable (s3://<bucket>)
    description: The source path for data files
  cluster_id:
    # no default on purpose: BUNDLE_VAR_cluster_id
    description: The ID of the existing cluster to run jobs on
  instance_profile_arn:
    # no default on purpose: BUNDLE_VAR_instance_profile_arn
    description: The AWS Instance Profile ARN to use for the pipeline clusters

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    # workspace host comes from DATABRICKS_HOST (or the ~/.databrickscfg profile)
    variables:
      catalog: soccer
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      # host comes from DATABRICKS_HOST; a fixed path under the deploying user keeps a single prod copy
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: soccer
      schema: prod
    permissions:
      - user_name: ${workspace.current_user.userName}
        level: CAN_MANAGE
