# This is a Databricks asset bundle definition for soccer_api_consumer.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: soccer_api_consumer
  uuid: 11855b37-874d-4842-9b41-d8a7678a33ae

include:
  - resources/*.yml
  - resources/*/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use
  source_path:
    description: The source path for data files
    default: "s3://cmurillo-target-bucket"
  cluster_id:
    description: The ID of the existing cluster to run jobs on
  instance_profile_arn:
    description: The AWS Instance Profile ARN to use for the pipeline clusters

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-06090e42-ea4e.cloud.databricks.com
    variables:
      catalog: soccer
      schema: ${workspace.current_user.short_name}
      cluster_id: "0204-223213-x0ko9ixc" # <--- REPLACE THIS WITH YOUR ACTUAL CLUSTER ID
      instance_profile_arn: "arn:aws:iam::500246988615:instance-profile/databricks-s3-instance-profile" # <--- REPLACE WITH YOUR AWS ACCOUNT ID
  prod:
    mode: production
    workspace:
      host: https://dbc-06090e42-ea4e.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/carlosalbertomurillomartinez@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/carlosalbertomurillomartinez@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: soccer
      schema: prod
    permissions:
      - user_name: carlosalbertomurillomartinez@gmail.com
        level: CAN_MANAGE
